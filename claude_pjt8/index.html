<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyboard Tester</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f8f9fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 24px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 500;
      color: #333;
      letter-spacing: 0.02em;
    }

    .display {
      background: #fff;
      border: 1.5px solid #e0e0e0;
      border-radius: 12px;
      padding: 16px 28px;
      min-width: 320px;
      text-align: center;
      color: #555;
      font-size: 0.95rem;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      transition: border-color 0.15s;
    }

    .display.active {
      border-color: #aaa;
    }

    .key-name {
      font-weight: 600;
      color: #222;
      font-size: 1.05rem;
    }

    .key-code {
      font-size: 0.8rem;
      color: #999;
      background: #f4f4f4;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #fff;
      border: 1.5px solid #e0e0e0;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .row {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .key {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      min-width: 44px;
      padding: 0 10px;
      background: #fff;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      color: #333;
      cursor: pointer;
      user-select: none;
      transition: all 0.08s ease;
      box-shadow: 0 2px 0 #d0d0d0;
      white-space: nowrap;
    }

    .key:hover {
      background: #f5f5f5;
      border-color: #bbb;
    }

    .key.pressed {
      background: #222;
      color: #fff;
      border-color: #222;
      box-shadow: 0 0 0 #d0d0d0;
      transform: translateY(2px);
    }

    .key.w2  { min-width: 68px; }
    .key.w3  { min-width: 90px; }
    .key.w4  { min-width: 120px; }
    .key.w5  { min-width: 200px; }
    .key.w6  { min-width: 260px; }

    .sub {
      font-size: 0.65rem;
      display: block;
      color: #aaa;
      margin-top: 1px;
    }

    .key.pressed .sub {
      color: #aaa;
    }

    footer {
      font-size: 0.8rem;
      color: #bbb;
    }

    /* Dark mode */
    body.dark {
      background: #1a1a1a;
    }

    body.dark h1 {
      color: #e0e0e0;
    }

    body.dark .display {
      background: #2a2a2a;
      border-color: #444;
      color: #aaa;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    body.dark .display.active {
      border-color: #777;
    }

    body.dark .key-name {
      color: #f0f0f0;
    }

    body.dark .key-code {
      color: #888;
      background: #333;
    }

    body.dark .keyboard {
      background: #2a2a2a;
      border-color: #444;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }

    body.dark .key {
      background: #333;
      border-color: #555;
      color: #e0e0e0;
      box-shadow: 0 2px 0 #222;
    }

    body.dark .key:hover {
      background: #3a3a3a;
      border-color: #777;
    }

    body.dark .key.pressed {
      background: #f0f0f0;
      color: #111;
      border-color: #f0f0f0;
      box-shadow: 0 0 0 #222;
    }

    body.dark footer {
      color: #555;
    }

    /* Theme toggle button */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 24px;
      background: #fff;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 500;
      color: #555;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .theme-toggle:hover {
      background: #f5f5f5;
      border-color: #bbb;
    }

    body.dark .theme-toggle {
      background: #2a2a2a;
      border-color: #555;
      color: #ccc;
    }

    body.dark .theme-toggle:hover {
      background: #333;
    }
  </style>
</head>
<body>

<button class="theme-toggle" id="themeToggle">🌙 다크모드</button>
<h1>Keyboard Tester</h1>

<div class="display" id="display">
  키를 누르거나 클릭하세요
</div>

<div class="keyboard">
  <!-- Row 0: Function keys -->
  <div class="row">
    <div class="key w2" data-key="Escape">Esc</div>
    <div class="key" data-key="F1">F1</div>
    <div class="key" data-key="F2">F2</div>
    <div class="key" data-key="F3">F3</div>
    <div class="key" data-key="F4">F4</div>
    <div class="key" data-key="F5">F5</div>
    <div class="key" data-key="F6">F6</div>
    <div class="key" data-key="F7">F7</div>
    <div class="key" data-key="F8">F8</div>
    <div class="key" data-key="F9">F9</div>
    <div class="key" data-key="F10">F10</div>
    <div class="key" data-key="F11">F11</div>
    <div class="key" data-key="F12">F12</div>
  </div>

  <!-- Row 1: Numbers -->
  <div class="row">
    <div class="key" data-key="Backquote">`</div>
    <div class="key" data-key="Digit1">1</div>
    <div class="key" data-key="Digit2">2</div>
    <div class="key" data-key="Digit3">3</div>
    <div class="key" data-key="Digit4">4</div>
    <div class="key" data-key="Digit5">5</div>
    <div class="key" data-key="Digit6">6</div>
    <div class="key" data-key="Digit7">7</div>
    <div class="key" data-key="Digit8">8</div>
    <div class="key" data-key="Digit9">9</div>
    <div class="key" data-key="Digit0">0</div>
    <div class="key" data-key="Minus">-</div>
    <div class="key" data-key="Equal">=</div>
    <div class="key w3" data-key="Backspace">⌫ Back</div>
  </div>

  <!-- Row 2: QWERTY -->
  <div class="row">
    <div class="key w3" data-key="Tab">Tab</div>
    <div class="key" data-key="KeyQ">Q</div>
    <div class="key" data-key="KeyW">W</div>
    <div class="key" data-key="KeyE">E</div>
    <div class="key" data-key="KeyR">R</div>
    <div class="key" data-key="KeyT">T</div>
    <div class="key" data-key="KeyY">Y</div>
    <div class="key" data-key="KeyU">U</div>
    <div class="key" data-key="KeyI">I</div>
    <div class="key" data-key="KeyO">O</div>
    <div class="key" data-key="KeyP">P</div>
    <div class="key" data-key="BracketLeft">[</div>
    <div class="key" data-key="BracketRight">]</div>
    <div class="key w2" data-key="Backslash">\</div>
  </div>

  <!-- Row 3: ASDF -->
  <div class="row">
    <div class="key w4" data-key="CapsLock">Caps Lock</div>
    <div class="key" data-key="KeyA">A</div>
    <div class="key" data-key="KeyS">S</div>
    <div class="key" data-key="KeyD">D</div>
    <div class="key" data-key="KeyF">F</div>
    <div class="key" data-key="KeyG">G</div>
    <div class="key" data-key="KeyH">H</div>
    <div class="key" data-key="KeyJ">J</div>
    <div class="key" data-key="KeyK">K</div>
    <div class="key" data-key="KeyL">L</div>
    <div class="key" data-key="Semicolon">;</div>
    <div class="key" data-key="Quote">'</div>
    <div class="key w4" data-key="Enter">Enter</div>
  </div>

  <!-- Row 4: ZXCV -->
  <div class="row">
    <div class="key w5" data-key="ShiftLeft">⇧ Shift</div>
    <div class="key" data-key="KeyZ">Z</div>
    <div class="key" data-key="KeyX">X</div>
    <div class="key" data-key="KeyC">C</div>
    <div class="key" data-key="KeyV">V</div>
    <div class="key" data-key="KeyB">B</div>
    <div class="key" data-key="KeyN">N</div>
    <div class="key" data-key="KeyM">M</div>
    <div class="key" data-key="Comma">,</div>
    <div class="key" data-key="Period">.</div>
    <div class="key" data-key="Slash">/</div>
    <div class="key w5" data-key="ShiftRight">⇧ Shift</div>
  </div>

  <!-- Row 5: Bottom -->
  <div class="row">
    <div class="key w3" data-key="ControlLeft">Ctrl</div>
    <div class="key w2" data-key="MetaLeft">⊞ Win</div>
    <div class="key w2" data-key="AltLeft">Alt</div>
    <div class="key w6" data-key="Space">Space</div>
    <div class="key w2" data-key="AltRight">Alt</div>
    <div class="key w2" data-key="MetaRight">⊞ Win</div>
    <div class="key w3" data-key="ControlRight">Ctrl</div>
  </div>

  <!-- Arrow keys -->
  <div class="row">
    <div class="key" data-key="ArrowLeft">←</div>
    <div class="key" data-key="ArrowUp">↑</div>
    <div class="key" data-key="ArrowDown">↓</div>
    <div class="key" data-key="ArrowRight">→</div>
  </div>
</div>

<footer>실제 키보드 입력도 감지됩니다</footer>

<script>
  // Dark mode
  const themeToggle = document.getElementById('themeToggle');

  function applyTheme(dark) {
    document.body.classList.toggle('dark', dark);
    themeToggle.textContent = dark ? '☀️ 라이트모드' : '🌙 다크모드';
    localStorage.setItem('theme', dark ? 'dark' : 'light');
  }

  const savedTheme = localStorage.getItem('theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(savedTheme ? savedTheme === 'dark' : prefersDark);

  themeToggle.addEventListener('click', () => {
    applyTheme(!document.body.classList.contains('dark'));
  });

  const display = document.getElementById('display');
  const keys = document.querySelectorAll('.key');

  const keyMap = {};
  keys.forEach(k => {
    keyMap[k.dataset.key] = k;
  });

  function pressKey(keyEl, label, code) {
    keyEl.classList.add('pressed');
    display.classList.add('active');
    display.innerHTML = `<span class="key-name">${label}</span><span class="key-code">${code}</span>`;
  }

  function releaseKey(keyEl) {
    keyEl.classList.remove('pressed');
    display.classList.remove('active');
  }

  // Mouse events on key elements
  keys.forEach(key => {
    key.addEventListener('mousedown', () => {
      const code = key.dataset.key;
      const label = key.textContent.trim();
      pressKey(key, label, code);
    });

    key.addEventListener('mouseup', () => releaseKey(key));
    key.addEventListener('mouseleave', () => {
      if (key.classList.contains('pressed')) releaseKey(key);
    });
  });

  // Keyboard events
  document.addEventListener('keydown', (e) => {
    e.preventDefault();
    const keyEl = keyMap[e.code];
    if (keyEl) {
      const label = keyEl.textContent.trim();
      pressKey(keyEl, label, e.code);
    } else {
      display.classList.add('active');
      display.innerHTML = `<span class="key-name">${e.key}</span><span class="key-code">${e.code}</span>`;
    }
  });

  document.addEventListener('keyup', (e) => {
    const keyEl = keyMap[e.code];
    if (keyEl) releaseKey(keyEl);
    else {
      display.classList.remove('active');
    }
  });
</script>
</body>
</html>
