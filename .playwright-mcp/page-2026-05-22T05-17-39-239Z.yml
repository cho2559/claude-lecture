            - paragraph [ref=e930]: "[사진 설명] 엘리스그룹이 마키나락스와 국방 및 산업 분야 AX를 위한 업무 협약을 체결했다. 왼쪽부터 엘리스그룹 전현욱 클라우드 영업이사, 마키나락스 김민성 국방사업본부장. AI 모듈형 데이터센터와 클라우드 가상화 솔루션 결합한 AI 풀스택 기반 국방 AX 선도AI 인프라와 클라우드, 산업별 솔루션을 제공하는 AI 풀스택 기업 ㈜엘리스그룹(대표 김재원)이 피지컬 AI 기업 마키나락스(대표 윤성호)와 국방 및 산업 분야의 AX(AI Transformation)를 위한 업무협약(MOU)을 체결했다. 이번 협약은 높은 보안 수준이 요구되는 국방 분야의 AI 전환을 선도하고, 이를 제조·에너지·금융 등 산업 전반으로 확산하기 위해 마련됐다. 양사는 엘리스그룹의 클라우드 소프트웨어 ‘ECI’와 AI 모듈형 데이터센터 ‘AI PMDC’를 결합한 AI 풀스택 역량에 마키나락스의 산업 특화형 AI 기술력을 결합해 강력한 시너지를 낼 계획이다. 마키나락스 AI OS ‘런웨이’ 연계해 안정적인 AI 운영체계 구축양사의 핵심 협력 분야는 ‘국방 AX’다. 엘리스그룹의 ECI(Elice Cloud Infrastructure) 기반 고보안 클라우드 환경에 마키나락스의 AI OS(Operating System) ‘런웨이(MakinaRocks Runway)’를 결합, 보안이 필수적인 폐쇄망 환경에서도 안정적인 AI 운영체계를 구축한다. ECI는 보안성과 효율성을 극대화한 AI 클라우드 가상화 솔루션으로 대규모 GPU 자원을 유연하게 관리하면서도 데이터를 안전하게 보호하는 고보안 환경을 제공한다. 양사는 이를 통해 국방 현장에 적용 가능한 고성능 AI 솔루션을 공급할 예정이다. 엘리스그룹이 개발한 AI 모듈형 데이터센터 ‘엘리스 AI PMDC’와 마키나락스의 버티컬 AI를 연계해 인프라 측면에서의 협업도 강화한다. 이를 통해 온프레미스 및 엣지 컴퓨팅 환경에서도 AI 모델을 효율적으로 배포∙운영할 수 있는 기술 고도화를 추진할 계획이다. 제조·에너지·금융 등 보안 핵심 산업까지 AX 솔루션 사업 확대양사는 국방 분야를 시작으로 제조, 에너지, 금융 등 보안과 안정성이 중요한 산업군으로 AX 솔루션 사업을 확대할 방침이다. 또한, 기술 인력 교류, 공동 세미나 개최 등 다각적인 협력을 이어갈 계획이다. 엘리스그룹 김재원 대표는 “마키나락스의 버티컬 AI 기술과 엘리스그룹의 ECI 및 AI 모듈형 데이터센터가 결합한 AI 풀스택 인프라가 만나 국방 AX의 새로운 표준을 만들 것”이라며, “앞으로도 공공 및 기업 고객이 보안 우려 없이 AI 기술을 도입할 수 있도록 최적화된 인프라와 솔루션을 제공하겠다”고 말했다."
