            - paragraph [ref=e909]: 코스닥 상장을 목표로 한국거래소에 상장예비심사청구서 제출… 본격적인 공모 절차 돌입 국내 유일 AX부터 인프라까지 이어지는 AI 풀스택 솔루션 기업… AI 클라우드 인프라, AI 클라우드, AI 솔루션 제공AI 인프라와 클라우드, 산업별 AX 솔루션을 제공하는 AI 풀스택 기업 엘리스그룹(대표이사 김재원)은 코스닥 상장을 목표로 한국거래소에 상장예비심사청구서를 제출하고 본격적인 상장 절차에 돌입했다고 19일 밝혔다. 상장 주관사는 미래에셋증권과 삼성증권이다. 2015년 설립된 엘리스그룹은 독자 개발한 AI 클라우드 기술을 바탕으로 풀스택 AI 솔루션을 제공할 수 있는 역량을 보유한 기업이다. 고성능 AI 클라우드부터 산업별 AX 솔루션까지 아우르는 'Full-Stack AI Partner'로서 비즈니스를 전개하고 있다. 주요 사업 영역은 크게 AX(AI 전환)와 AI클라우드로 구분된다. AX의 경우 ▲산업별 AX 솔루션 ▲전 연령 AI 인재 양성을 위한 플랫폼인 '엘리스LXP’ ▲AI 모델 'Helpy’ 시리즈 ▲‘AI헬피챗'이 있다. AI 클라우드의 경우 대규모 GPU 자원을 효율적으로 운영, 활용할 수 있는 ▲AI 클라우드 인프라(AI PMDC, ECI) ▲GPUaaS 서비스 등이 있다. AI PMDC 전 공정 수직계열화 구축… 기존 IDC 대비 구축 기간 및 비용 절감엘리스그룹은 전 공정 수직계열화 역량을 기반으로 AI PMDC(이동식 모듈형 데이터 센터)를 3개월 이내에 구축하며 기존 IDC 방식 대비 초기 인프라 구축 비용을 최대 50% 절감하고 있다. 또한 자체 개발한 AI 클라우드 인프라 최적화 플랫폼인 'ECI(Elice Cloud Infrastructure)'로 최대 1만장의 그래픽처리장치(GPU)를 하나의 가상 클러스터로 묶어 대규모 연산에 최적화했다. 이러한 기술 경쟁력을 바탕으로 엘리스그룹은 견조한 실적 우상향 기조를 이어가고 있다. 연결 기준 매출액은 2022년 246억 원에서 2025년 395억 원으로 크게 증가하며 AI 풀스택 비즈니스의 탄탄한 성장성을 입증했다. 무엇보다 지난 5년간 AI 인프라 시장 선점을 위해 대규모 선제 투자를 단행했음에도 불구하고 매년 안정적인 흑자 기조를 유지하며 시장 내 보기 드문 '수익형 AI 기업'으로서의 차별화된 이익 창출력을 입증했다. 김재원 엘리스그룹 대표이사는 "엘리스그룹은 국내 유일 AX부터 인프라로 이어지는 풀스택 AI 솔루션을 통해 고객사에게 독보적인 성능 효율과 경제성을 동시에 제공할 수 있는 대체 불가능한 AI 클라우드 전문 기업"이라며 "이번 코스닥 상장 준비는 국내 시장 선점 고도화와 글로벌 시장 진출 가속화를 위한 중요한 과정으로 상장 심사 단계를 차질 없이 준비하겠다"고 밝혔다.
