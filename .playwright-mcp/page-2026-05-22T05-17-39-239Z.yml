          - img "엘리스그룹-스탠다드에너지, ‘K-AI PMDC’로 글로벌 시장 공략" [ref=e920]
          - generic [ref=e921]:
            - heading "엘리스그룹-스탠다드에너지, ‘K-AI PMDC’로 글로벌 시장 공략" [level=6] [ref=e922]
            - paragraph [ref=e923]: 6일, 스탠다드에너지와 ‘AI PMDC 및 전력 솔루션 개발 MOU’ 체결AI 인프라와 클라우드, 산업별 솔루션을 제공하는 AI 풀스택 기업 ㈜엘리스그룹(대표 김재원)이 배터리 전문 기업 스탠다드에너지(대표 김부기)와 ‘AI 모듈형 데이터센터(PMDC) 및 VIB 기반 전력 솔루션 공동 개발’을 위한 업무협약(MOU)을 지난 6일 체결했다. 이번 협약은 AI 서비스 확산으로 데이터센터 수요가 빠르게 증가하는 가운데, AI 인프라 운영의 핵심 과제인 전력 안정성, 화재 안전성, 에너지 효율을 동시에 높이기 위해 추진됐다. 양사는 엘리스그룹의 AI 모듈형 데이터센터 ‘엘리스 AI PMDC’에 스탠다드에너지의 ‘바나듐이온배터리(VIB)’ 기술을 접목해 고효율 전력 인프라 솔루션을 공동 개발한다. 스탠다드에너지가 개발한 바나듐이온배터리는 기존 리튬이온배터리와 달리 물을 주성분으로 하는 전해액을 사용해 화재 발생을 차단한다. 이로 인해 고성능 GPU 가동으로 전력 사용량과 열 발생이 큰 AI 데이터센터 환경에서 안정적인 전력 공급과 에너지 효율 개선에 기여할 수 있다는 점에서 주목받고 있다. 지난해 아시아 최초, 국내 최초로 수랭식 B200 AI 데이터센터를 상용화한 엘리스그룹의 수랭식 AI 데이터센터 기술력과 결합해 안전성과 전력 효율을 높인 차세대 AI 데이터센터 표준을 만들어간다는 계획이다. 수랭식 AI PMDC와 바나듐이온배터리 결합해 안전성과 전력 효율 강화한 K-PMDC 수출 모델 완성양사는 PMDC 환경에 최적화된 모듈형 비상 전원 장치(UPS)와 에너지 저장 장치(BESS)를 공동 개발하고, AI를 활용해 에너지 사용 패턴을 분석·예측하는 에너지 관리 시스템(EMS) 고도화에 나선다. 엘리스그룹은 PMDC 운영 데이터를 바탕으로 AI 적용 기술을 지원하며, 스탠다드에너지는 바나듐이온배터리의 안정적인 공급과 기술 표준화를 담당한다. 향후 양사는 이번 협력 모델을 기반으로 정부 주도의 국가 AI 데이터센터(AIDC) 구축 사업에 공동 참여하는 등 공공 및 민간 데이터센터 시장을 함께 공략할 계획이다. 또한, 일본을 비롯한 해외 시장 진출에도 협력해 나갈 방침이다. 엘리스그룹 김재원 대표는 “지속 가능한 AI 인프라 운영을 위해서는 안전하고 효율적인 에너지 솔루션이 핵심 요소”라며, “엘리스그룹이 국내에서 선도하고 있는 AI 모듈러 데이터센터 기술 역량에 스탠다드에너지의 배터리 기술을 결합해 AI 가동에 최적화된 에너지 효율성을 확보하고, 장소 제약을 줄이면서도 안정적인 고성능 컴퓨팅 환경을 제공하는 차세대 AI 데이터센터 표준을 만들어가겠다”고 전했다. 스탠다드에너지 김부기 대표는 “전력 인프라는 AI 산업의 최종 승부처가 될 것”이라며, “물리적 공간 제약을 해결한 AI PMDC와 안전성이 검증된 VIB ESS의 결합은 AI 데이터센터 확산의 중요한 계기가 될 것이며, 전력망 부담은 낮추고 효율은 높이는 최적의 해법을 제시하겠다”고 전했다.
            - paragraph [ref=e924]: 2026. 5. 7.
