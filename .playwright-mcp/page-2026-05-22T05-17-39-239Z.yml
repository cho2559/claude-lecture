          - img "엘리스그룹, 고용노동부 ‘K-디지털 트레이닝 AI 캠퍼스’ 운영기관 선정" [ref=e913]
          - generic [ref=e914]:
            - heading "엘리스그룹, 고용노동부 ‘K-디지털 트레이닝 AI 캠퍼스’ 운영기관 선정" [level=6] [ref=e915]
            - paragraph [ref=e916]: 고성능 AI 클라우드·실무형 프로젝트 등 기업 현장과 동일한 개발 환경 제공AI 인프라와 클라우드, 산업별 솔루션을 제공하는 AI 풀스택 기업 ㈜엘리스그룹(대표 김재원)이 고용노동부가 주관하는 'K-디지털 트레이닝(KDT) AI 캠퍼스' 사업 운영기관에 선정됐다. 엘리스그룹은 이번 선정을 계기로 ‘AI 풀스택’ 역량을 바탕으로 한 실무 인재 양성에 나선다. KDT AI 캠퍼스는 급증하는 AI 인력 수요에 대응해 주요 AI 직무의 현업 엔지니어 1만 명 양성을 목표로 정부가 약 1,300억원을 들여 올해 첫 시행하는 사업이다. 엘리스그룹은 올해 AI 코어 엔지니어, AI 애플리케이션 개발자 직군을 중심으로 총 3개 과정을 운영한다. 특히, AI 도입 이전 단계인 제조 기업의 실제 원천 데이터를 활용해 산업 현장의 AX 프로젝트를 전 과정에 걸쳐 수행하는 것이 특징이다. 이를 통해 수강생들은 공정 최적화, 품질 예측 등 현업 AX 과제를 직접 수행하며 산업 현장의 AX를 바로 지원할 수 있는 실질적인 AI 역량을 갖추게 된다. 이번 과정의 차별점은 엘리스그룹이 보유한 자체 고성능 AI 인프라 ‘엘리스클라우드’다. 수강생들은 개인 학습 여건에서는 경험하기 어려운 고성능 GPU 환경에서 대규모 데이터 처리, 복잡한 AI 모델 개발 등을 수행하게 된다. 이를 통해 실제 기업의 개발 프로세스와 유사한 환경을 경험하며 기술 역량을 강화할 수 있다는 점에서 의미가 크다. 300인 이상 기업 취업 비중 최대 2배 성과 기반으로 취업까지 전 과정 지원2020년부터 개발자 취업 준비생을 위한 부트캠프 ‘엘리스트랙(K-디지털 트레이닝)’을 운영해 온 엘리스그룹은 1,500명 이상 청년층 대상 교육을 진행, 고용노동부로부터 ‘우수훈련기관’으로 선정되는 등 성과를 인정받았다. 특히, 교육부터 취업 연계까지 전 과정을 집중 지원하는 등 취업의 질적 측면을 강조해 온 결과, 2025년 기준 300인 이상 중견∙대기업 취업 비중이 타 훈련기관 대비 1.5~2배 이상 높은 것으로 나타났다. 엘리스그룹 김재원 대표는 “이번 K-디지털 트레이닝 AI 캠퍼스 선정을 통해, 더 많은 청년들이 최신 AI 기술을 실제 산업 현장에서 통하는 역량으로 연결할 수 있도록 지원하겠다”며, “엘리스그룹이 보유한 교육 실습 플랫폼, 고성능 클라우드 인프라, 산업별 AI 프로젝트 경험을 결합해 국내 최고 수준의 실무형 AI 인재 양성 모델을 만들어 가겠다”고 말했다. 한편, 엘리스그룹 AI 캠퍼스 과정은 내일배움카드 발급자라면 누구나 전액 무료로 참여할 수 있으며, 출석률에 따라 훈련수당도 지급된다. 오는 6월부터 모집이 시작되며 교육 신청 관련 소식은 엘리스트랙 홈페이지에서 사전 알림을 신청해 받을 수 있다.
            - paragraph [ref=e917]: 2026. 5. 12.
